# Mantiene despierto el proyecto de Supabase.
#
# POR QUÉ EXISTE
#   En el plan Free, Supabase pausa el proyecto tras 7 días sin actividad de la
#   base de datos. La pausa no borra datos, pero deja la plataforma caída hasta
#   que alguien entre al panel y le dé "Resume project". Con un demo de uso
#   intermitente, eso pasa un lunes cualquiera y los laboratoristas se
#   encuentran la aplicación muerta.
#
#   Esta acción hace una consulta trivial dos veces por semana. Basta para que
#   el proyecto cuente como activo.
#
# CONFIGURACIÓN (una sola vez)
#   En GitHub → Settings → Secrets and variables → Actions → New repository secret:
#     SUPABASE_URL       = https://<ref>.supabase.co
#     SUPABASE_ANON_KEY  = la clave anon (la misma de .env.local)
#   Son los mismos valores públicos que ya usa el navegador; no expone nada nuevo.
#
# LIMITACIÓN CONOCIDA DE GITHUB
#   Los workflows programados se desactivan solos tras 60 días sin commits en el
#   repositorio. Si el proyecto queda quieto mucho tiempo, GitHub avisa por correo
#   y basta con reactivarlo desde la pestaña Actions.

name: Keep-alive Supabase

on:
  schedule:
    # Lunes y jueves a las 12:00 UTC (07:00 en Colombia).
    - cron: "0 12 * * 1,4"
  # Permite ejecutarlo a mano desde la pestaña Actions para comprobar que sirve.
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar la base de datos
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Faltan los secretos SUPABASE_URL o SUPABASE_ANON_KEY."
            exit 1
          fi

          # Se consulta `laboratories`, que el rol anon puede leer (RLS: is_active).
          codigo=$(curl -sS -o /tmp/respuesta.json -w "%{http_code}" \
            "${SUPABASE_URL}/rest/v1/laboratories?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")

          echo "HTTP ${codigo}"
          cat /tmp/respuesta.json

          if [ "$codigo" != "200" ]; then
            echo ""
            echo "La base no respondió correctamente. Puede estar pausada:"
            echo "entra al panel de Supabase y usa 'Resume project'."
            exit 1
          fi

          echo ""
          echo "Base activa."
